spring:
  application:
    name: sjakkportal
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/sjakkportal}
    username: ${DATABASE_USERNAME:sjakkportal}
    password: ${DATABASE_PASSWORD:sjakkportal}
    hikari:
      # Small on purpose: free-tier hosts have 512 MB of memory and the free database few connections.
      maximum-pool-size: ${DATABASE_POOL_SIZE:5}
      connection-timeout: 20000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  web:
    resources:
      add-mappings: false     # API only: unknown paths are 404 problems, not static-resource lookups

server:
  # Render and similar hosts tell the app which port to use through PORT.
  port: ${PORT:8080}
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

sjakkportal:
  jwt:
    secret: ${SJAKKPORTAL_JWT_SECRET:}
    access-ttl: 15m
    refresh-ttl: 30d
  cookie:
    # Lax works when the browser reaches the API through the frontend's own domain (the Vercel rewrite).
    # Use None only if the browser calls the API on another site directly; see docs/SECURITY.md.
    same-site: ${SJAKKPORTAL_COOKIE_SAME_SITE:Lax}
  cors:
    allowed-origins: ${SJAKKPORTAL_ALLOWED_ORIGINS:http://localhost:5173}
  bootstrap-admin:
    username: ${SJAKKPORTAL_ADMIN_USERNAME:}
    password: ${SJAKKPORTAL_ADMIN_PASSWORD:}
  client-ip:
    header: ${SJAKKPORTAL_CLIENT_IP_HEADER:}
    trusted-hops: ${SJAKKPORTAL_CLIENT_IP_TRUSTED_HOPS:1}
  rate-limit:
    login:
      capacity: 5
      period: 1m
    login-address:
      capacity: 20
      period: 1m
    invite:
      capacity: 10
      period: 1m
    password-reset:
      capacity: 5
      period: 1m
    game-submission:
      capacity: 30
      period: 1m

logging:
  pattern:
    # Every log line carries the request's trace id (X-Trace-Id), the same one shown to users with errors.
    level: "%5p [%X{traceId:-}]"
