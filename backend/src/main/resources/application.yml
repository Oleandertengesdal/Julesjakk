spring:
  application:
    name: sjakkportal
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/sjakkportal}
    username: ${DATABASE_USERNAME:sjakkportal}
    password: ${DATABASE_PASSWORD:sjakkportal}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true

server:
  error:
    include-stacktrace: never
    include-message: never
