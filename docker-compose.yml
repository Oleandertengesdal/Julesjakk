# Local PostgreSQL for development and for the backend test suite.
#   docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sjakkportal
      POSTGRES_PASSWORD: sjakkportal
      POSTGRES_DB: sjakkportal
    ports:
      - "5432:5432"
    volumes:
      - sjakkportal-pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sjakkportal"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  sjakkportal-pgdata:
